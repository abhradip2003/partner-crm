<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Mind Map</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        :root {
            --bg-color: #0d1b2a;
            --gradient-top: #1f4068;
            --teal: #00b8a9;
            --text-light: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--gradient-top), var(--bg-color));
            color: var(--text-light);
            min-height: 100vh;
        }

        /* Views */
        .view { display: none; padding: 40px; }
        .view.active { display: block; }

        /* Login Screen */
        #login-view { text-align: center; margin-top: 15vh; }
        .login-box { background: rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; display: inline-block; }
        .login-box input { padding: 10px; border-radius: 5px; border: none; font-size: 16px; margin-right: 10px; text-align: center;}
        .btn { background: var(--teal); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold;}
        
        /* Home Screen */
        .home-container { max-width: 900px; margin: 0 auto; text-align: center; }
        .title { font-size: 48px; margin: 10px 0 40px; font-weight: 700; text-transform: uppercase;}
        
        /* Search Bar & Dropdown */
        .search-container { position: relative; max-width: 500px; margin: 0 auto 50px auto; }
        .search-bar { width: 100%; box-sizing: border-box; padding: 15px 20px; border-radius: 30px; border: none; font-size: 16px; outline: none; }
        
        .dropdown-content {
            display: none; position: absolute; background-color: #ffffff; color: #333;
            width: 100%; border-radius: 15px; margin-top: 5px; max-height: 250px; overflow-y: auto; z-index: 10;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); text-align: left;
        }
        .dropdown-item { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid #eee; font-weight: 600;}
        .dropdown-item:hover { background-color: #f1f1f1; color: var(--teal);}

        /* The 6 Buttons Grid */
        .partner-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            max-width: 700px;
            margin: 0 auto;
        }
        .partner-btn { 
            background: transparent; 
            border: 2px solid rgba(255,255,255,0.3); 
            color: white; 
            padding: 20px; 
            border-radius: 30px; 
            font-size: 18px; 
            font-weight: 600;
            cursor: pointer; 
            transition: 0.3s; 
        }
        .partner-btn:hover { background: rgba(255,255,255,0.1); border-color: white; }

        /* Flowchart Screen */
        .header-controls { margin-bottom: 20px; }
        .flowchart-container { display: flex; align-items: flex-start; margin-top: 30px; }
        .partner-name-side { flex: 1; font-size: 50px; font-weight: 700; color: var(--teal); line-height: 1.1; position: sticky; top: 50px; }
        .timeline-side { flex: 2; position: relative; padding-left: 80px; border-left: 2px solid #333; }
        
        /* Nodes */
        .convo-node { position: relative; margin-bottom: 30px; display: flex; cursor: pointer; }
        .node-number { position: absolute; left: -105px; width: 45px; height: 45px; background: white; color: black; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; border: 4px solid var(--bg-color); }
        .convo-card { background: var(--teal); color: #000; padding: 20px; border-radius: 15px; min-width: 350px; width: 100%; box-sizing: border-box;}
        .convo-date { font-weight: 700; font-size: 16px; margin-bottom: 5px;}
        .convo-details { display: none; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 10px; margin-top: 10px; font-size: 14px; }
        
        /* Inputs for New Log */
        .input-group { margin-top: 10px; }
        .input-group input, .input-group textarea { width: 100%; margin-top: 5px; padding: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; font-family: 'Montserrat', sans-serif;}
        #loader { display: none; color: var(--teal); font-weight: bold; margin-bottom: 20px; font-size: 18px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN VIEW -->
    <div id="login-view" class="view active">
        <div class="login-box">
            <h2>Partner Repository</h2>
            <p style="margin-bottom: 20px;">Please enter your PIN</p>
            <input type="password" id="passcode" placeholder="****" maxlength="10">
            <button class="btn" onclick="handleLogin()">Enter</button>
        </div>
    </div>

    <!-- 2. HOME VIEW -->
    <div id="home-view" class="view">
        <div class="home-container">
            <div style="font-size: 14px; letter-spacing: 2px; color: #ccc;">NEVER MISS A CONVO</div>
            <div class="title">PARTNER REPOSITORY</div>
            <div id="loader">Syncing with database...</div>
            
            <div class="search-container">
                <input type="text" class="search-bar" id="searchInput" placeholder="🔍 Search for a partner..." autocomplete="off">
                <div id="search-dropdown" class="dropdown-content">
                    <!-- Dropdown suggestions populate here -->
                </div>
            </div>

            <div class="partner-grid" id="partner-grid">
                <!-- Exactly 6 Buttons populate here -->
            </div>
        </div>
    </div>

    <!-- 3. PARTNER FLOWCHART VIEW -->
    <div id="partner-view" class="view">
        <div class="header-controls">
            <button class="btn" onclick="goHome()">← Back to Repository</button>
        </div>
        
        <div class="flowchart-container">
            <div class="partner-name-side" id="current-partner-name">Partner Name</div>
            
            <div class="timeline-side" id="timeline-container">
                <!-- Logs populate here -->
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. PASTE YOUR GOOGLE WEB APP URL HERE:
        const DATABASE_URL = "https://script.google.com/macros/s/AKfycbwhIws2-xovVYXiBhr0KjeJLfws45LnNVpNV1Z0uIuy-6gTycBUplrs_kkE-ltv61m2Iw/exec"; 
        
        // 2. SET YOUR SECURE PIN HERE:
        const SYSTEM_PIN = "924803"; 
        // ==========================================

        let globalPartners = [];
        let globalLogs = [];
        let activePartner = "";

        // Login Logic
        function handleLogin() {
            if(document.getElementById('passcode').value === SYSTEM_PIN) {
                document.getElementById('login-view').classList.remove('active');
                document.getElementById('home-view').classList.add('active');
                fetchData();
            } else {
                alert("Incorrect PIN");
                document.getElementById('passcode').value = ""; // clear box
            }
        }

        // Add Enter key support for Login
        document.getElementById('passcode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleLogin();
        });

        function goHome() {
            document.getElementById('partner-view').classList.remove('active');
            document.getElementById('home-view').classList.add('active');
            document.getElementById('searchInput').value = ""; // clear search
        }

        // Fetch Data from Google Sheets
        async function fetchData() {
            document.getElementById('loader').style.display = 'block';
            try {
                const response = await fetch(DATABASE_URL);
                const data = await response.json();
                
                globalPartners = data.partners;
                globalLogs = data.logs;
                
                renderSixButtons(globalPartners);
            } catch (error) {
                alert("Error connecting to database. Please refresh.");
            }
            document.getElementById('loader').style.display = 'none';
        }

        // Render Exactly 6 Buttons on the Homepage
        function renderSixButtons(partners) {
            const grid = document.getElementById('partner-grid');
            grid.innerHTML = "";
            
            // Slice the array to only grab the first 6 partners
            const topSix = partners.slice(0, 6);
            
            topSix.forEach(partner => {
                const btn = document.createElement('button');
                btn.className = 'partner-btn';
                btn.textContent = partner;
                btn.onclick = () => openPartnerFlowchart(partner);
                grid.appendChild(btn);
            });
        }

        // --- NEW SEARCH LOGIC (Dropdown & Enter Key) ---
        const searchInput = document.getElementById('searchInput');
        const dropdown = document.getElementById('search-dropdown');

        // As you type:
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            dropdown.innerHTML = ""; // clear previous suggestions
            
            if (!query) { 
                dropdown.style.display = 'none'; 
                return; 
            }

            // Find matching partners
            const filtered = globalPartners.filter(p => p.toLowerCase().includes(query));
            
            if (filtered.length > 0) {
                dropdown.style.display = 'block';
                filtered.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'dropdown-item';
                    div.textContent = p;
                    // If clicked, open that partner
                    div.onclick = () => {
                        searchInput.value = p;
                        dropdown.style.display = 'none';
                        openPartnerFlowchart(p);
                    };
                    dropdown.appendChild(div);
                });
            } else {
                dropdown.style.display = 'none';
            }
        });

        // If you hit Enter:
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.toLowerCase();
                if(!query) return;

                // Find the first match
                const match = globalPartners.find(p => p.toLowerCase().includes(query));
                if (match) {
                    searchInput.value = match;
                    dropdown.style.display = 'none';
                    openPartnerFlowchart(match);
                } else {
                    alert("No partner found matching that name.");
                }
            }
        });

        // Hide dropdown if clicked outside
        document.addEventListener('click', function(e) {
            if (e.target !== searchInput && e.target !== dropdown) {
                dropdown.style.display = 'none';
            }
        });


        // Render Flowchart
        function openPartnerFlowchart(partnerName) {
            activePartner = partnerName;
            document.getElementById('home-view').classList.remove('active');
            document.getElementById('partner-view').classList.add('active');
            document.getElementById('current-partner-name').innerHTML = partnerName.replace(/ /g, '<br>');
            
            const timeline = document.getElementById('timeline-container');
            timeline.innerHTML = "";
            
            // Filter logs for this specific partner
            const partnerLogs = globalLogs.filter(log => log.partner === partnerName);
            
            // Build the existing conversation nodes
            partnerLogs.forEach((log, index) => {
                timeline.innerHTML += `
                    <div class="convo-node" onclick="toggleDetails(this)">
                        <div class="node-number">${index + 1}</div>
                        <div class="convo-card">
                            <div class="convo-date">${new Date(log.date).toLocaleDateString()}</div>
                            <div><strong>Subject:</strong> ${log.subject}</div>
                            <div class="convo-details">
                                <p><strong>Notes:</strong><br>${log.notes.replace(/\n/g, '<br>')}</p>
                                <p><strong>Actionables:</strong><br>${log.actionables.replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Add the "New Log" creation node at the bottom
            timeline.innerHTML += `
                <div class="convo-node" style="margin-top:50px;">
                    <div class="node-number" style="background:var(--teal); color:white; border-color:var(--teal);">+</div>
                    <div class="convo-card" style="background:#fff; color:#000;">
                        <div class="convo-date" style="color:var(--teal); font-size:20px;">Log New Conversation</div>
                        <div class="input-group"><input type="date" id="newDate"></div>
                        <div class="input-group"><input type="text" id="newSubject" placeholder="Subject line (e.g. Q3 Planning)..."></div>
                        <div class="input-group"><textarea id="newNotes" rows="3" placeholder="Conversation notes..."></textarea></div>
                        <div class="input-group"><textarea id="newAction" rows="3" placeholder="Actionables checklist..."></textarea></div>
                        <button class="btn" style="margin-top:15px; width:100%;" onclick="saveLog()">Save to Database</button>
                    </div>
                </div>
            `;
            // Set today's date automatically
            document.getElementById('newDate').valueAsDate = new Date();
        }

        function toggleDetails(element) {
            const details = element.querySelector('.convo-details');
            details.style.display = details.style.display === 'block' ? 'none' : 'block';
        }

        // Post Data Back to Google Sheets
        async function saveLog() {
            const date = document.getElementById('newDate').value;
            const subject = document.getElementById('newSubject').value;
            const notes = document.getElementById('newNotes').value;
            const action = document.getElementById('newAction').value;

            if(!subject) { alert("Subject line is required to save a log!"); return; }

            const payload = { partner: activePartner, date: date, subject: subject, notes: notes, actionables: action };
            
            // Immediately update UI locally
            globalLogs.push(payload); 
            openPartnerFlowchart(activePartner); 

            // Send to Google Sheets in background
            try {
                await fetch(DATABASE_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error("Failed to sync to database", error);
            }
        }
    </script>
</body>
</html>
